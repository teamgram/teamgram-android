name: Build Teamgram APK

on:
  workflow_dispatch:   # فقط دستی اجرا می‌شه

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZxGram-APK
          path: |
            **/outputs/apk/**/*.apk
            **/outputs/apk/**/*.aab
